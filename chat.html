<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARKANET · MESSAGERIE</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --green:#00ff41;--green-dim:#00b32c;--green-dark:#003b0f;
      --bg:#000;--sidebar-bg:rgba(0,6,1,0.97);--chat-bg:rgba(0,3,1,0.97);
      --msg-bg:rgba(0,255,65,0.1);--msg-own:rgba(0,255,65,0.18);
      --border:rgba(0,255,65,0.12);--text:#c8ffd4;--text-dim:#5a8c62;
      --red:#ff3a3a;--glow:0 0 15px rgba(0,255,65,0.3);
      --header-h:60px;--sidebar-w:320px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;
      font-family:'Share Tech Mono',monospace;}
    #matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:0.18;}
    body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 6px);}

    /* ── APP SHELL ── */
    .app{position:relative;z-index:2;display:flex;height:100vh;width:100%;overflow:hidden;}

    /* ── SIDEBAR ── */
    .sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;
      background:var(--sidebar-bg);border-right:1px solid var(--border);
      display:flex;flex-direction:column;transition:transform 0.3s ease;z-index:20;}

    /* SIDEBAR HEADER */
    .sidebar-header{padding:16px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .sidebar-logo span{font-family:'Orbitron',monospace;font-weight:900;font-size:1.1rem;
      color:var(--green);letter-spacing:3px;
      text-shadow:0 0 15px rgba(0,255,65,0.5);}
    .sidebar-logo .status-dot{width:8px;height:8px;border-radius:50%;
      background:var(--green);box-shadow:0 0 8px var(--green);
      animation:pulse-dot 2s ease-in-out infinite;}

    /* USER PROFILE */
    .user-profile{display:flex;align-items:center;gap:10px;padding:10px;
      border:1px solid var(--border);border-radius:2px;cursor:pointer;
      transition:all 0.2s;background:rgba(0,255,65,0.03);}
    .user-profile:hover{background:rgba(0,255,65,0.07);border-color:rgba(0,255,65,0.25);}
    .avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--green-dim);
      display:flex;align-items:center;justify-content:center;
      font-size:14px;font-family:'Orbitron',monospace;font-weight:700;
      color:var(--green);background:rgba(0,255,65,0.08);flex-shrink:0;position:relative;}
    .avatar-online::after{content:'';position:absolute;bottom:1px;right:1px;
      width:9px;height:9px;border-radius:50%;background:var(--green);
      border:2px solid var(--sidebar-bg);box-shadow:0 0 6px var(--green);}
    .user-name{font-size:0.72rem;color:var(--text);letter-spacing:2px;}
    .user-status{font-size:0.58rem;color:var(--green);letter-spacing:1px;opacity:0.7;}

    /* SEARCH */
    .search-box{padding:12px 16px;border-bottom:1px solid var(--border);}
    .search-input{width:100%;background:rgba(0,255,65,0.04);border:1px solid rgba(0,255,65,0.15);
      padding:10px 14px;color:var(--green);font-family:'Share Tech Mono',monospace;
      font-size:0.75rem;outline:none;letter-spacing:1px;transition:all 0.2s;border-radius:1px;}
    .search-input::placeholder{color:rgba(0,255,65,0.25);}
    .search-input:focus{border-color:var(--green-dim);background:rgba(0,255,65,0.06);}

    /* NAV TABS */
    .nav-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
    .nav-tab{flex:1;padding:10px 6px;text-align:center;font-size:0.58rem;
      letter-spacing:2px;color:var(--text-dim);cursor:pointer;
      border-bottom:2px solid transparent;transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;}
    .nav-tab.active{color:var(--green);border-bottom-color:var(--green);}
    .nav-tab:hover:not(.active){color:var(--text);background:rgba(0,255,65,0.03);}

    /* CONVERSATIONS LIST */
    .conv-list{flex:1;overflow-y:auto;padding:8px 0;}
    .conv-list::-webkit-scrollbar{width:4px;}
    .conv-list::-webkit-scrollbar-track{background:transparent;}
    .conv-list::-webkit-scrollbar-thumb{background:rgba(0,255,65,0.2);border-radius:2px;}

    .conv-item{display:flex;align-items:center;gap:10px;padding:10px 16px;
      cursor:pointer;transition:all 0.15s;border-left:2px solid transparent;}
    .conv-item:hover{background:rgba(0,255,65,0.05);border-left-color:rgba(0,255,65,0.3);}
    .conv-item.active{background:rgba(0,255,65,0.09);border-left-color:var(--green);}
    .conv-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:15px;font-family:'Orbitron',monospace;font-weight:700;
      color:var(--green);border:1px solid rgba(0,255,65,0.25);
      background:rgba(0,255,65,0.07);flex-shrink:0;position:relative;}
    .conv-avatar.online::after{content:'';position:absolute;bottom:1px;right:1px;
      width:10px;height:10px;border-radius:50%;background:var(--green);
      border:2px solid var(--sidebar-bg);}
    .conv-info{flex:1;min-width:0;}
    .conv-name{font-size:0.72rem;color:var(--text);letter-spacing:1px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .conv-last{font-size:0.6rem;color:var(--text-dim);letter-spacing:1px;margin-top:2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
    .conv-time{font-size:0.55rem;color:var(--text-dim);letter-spacing:1px;}
    .conv-badge{background:var(--green);color:#000;font-size:0.55rem;font-weight:700;
      width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

    /* SIDEBAR FOOTER */
    .sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);
      display:flex;gap:8px;flex-shrink:0;}
    .footer-btn{flex:1;padding:10px;background:transparent;border:1px solid rgba(0,255,65,0.15);
      color:var(--text-dim);font-family:'Share Tech Mono',monospace;font-size:0.6rem;
      letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-align:center;}
    .footer-btn:hover{border-color:var(--green);color:var(--green);background:rgba(0,255,65,0.05);}
    .footer-btn.danger:hover{border-color:var(--red);color:var(--red);}

    /* ── CHAT AREA ── */
    .chat-area{flex:1;display:flex;flex-direction:column;height:100vh;background:var(--chat-bg);}

    /* CHAT HEADER */
    .chat-header{height:var(--header-h);padding:0 20px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:14px;flex-shrink:0;
      background:rgba(0,6,1,0.98);}
    .menu-btn{display:none;background:none;border:none;color:var(--green);
      font-size:20px;cursor:pointer;padding:4px 8px;}
    .chat-contact-avatar{width:38px;height:38px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-family:'Orbitron',monospace;font-size:14px;color:var(--green);
      border:1px solid rgba(0,255,65,0.3);background:rgba(0,255,65,0.07);}
    .chat-contact-info{flex:1;}
    .chat-contact-name{font-family:'Orbitron',monospace;font-size:0.8rem;
      color:var(--green);letter-spacing:2px;}
    .chat-contact-status{font-size:0.6rem;color:var(--green-dim);letter-spacing:2px;
      display:flex;align-items:center;gap:5px;}
    .status-dot-sm{width:6px;height:6px;border-radius:50%;background:var(--green);
      animation:pulse-dot 2s ease-in-out infinite;}
    .chat-actions{display:flex;gap:6px;}
    .action-btn{background:none;border:1px solid rgba(0,255,65,0.15);
      color:var(--text-dim);font-size:14px;width:34px;height:34px;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:all 0.2s;border-radius:1px;}
    .action-btn:hover{border-color:var(--green);color:var(--green);background:rgba(0,255,65,0.07);}

    /* MESSAGES AREA */
    .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
    .messages::-webkit-scrollbar{width:4px;}
    .messages::-webkit-scrollbar-thumb{background:rgba(0,255,65,0.15);border-radius:2px;}

    /* DATE SEPARATOR */
    .date-sep{text-align:center;font-size:0.58rem;color:var(--text-dim);
      letter-spacing:3px;padding:8px 0;display:flex;align-items:center;gap:10px;}
    .date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:rgba(0,255,65,0.1);}

    /* MESSAGE BUBBLES */
    .msg{display:flex;gap:10px;max-width:75%;animation:msgIn 0.3s ease;}
    .msg.own{align-self:flex-end;flex-direction:row-reverse;}
    .msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:11px;font-family:'Orbitron',monospace;color:var(--green);
      border:1px solid rgba(0,255,65,0.2);background:rgba(0,255,65,0.06);margin-top:2px;}
    .msg-content{display:flex;flex-direction:column;gap:3px;}
    .msg.own .msg-content{align-items:flex-end;}
    .msg-sender{font-size:0.55rem;color:var(--green-dim);letter-spacing:2px;padding:0 4px;}
    .msg-bubble{padding:10px 14px;border:1px solid rgba(0,255,65,0.15);border-radius:2px;
      background:var(--msg-bg);position:relative;max-width:100%;}
    .msg.own .msg-bubble{background:var(--msg-own);border-color:rgba(0,255,65,0.3);}
    .msg-text{font-size:0.82rem;color:var(--text);line-height:1.6;word-break:break-word;}
    .msg-time{font-size:0.52rem;color:var(--text-dim);letter-spacing:1px;
      padding:0 4px;display:flex;align-items:center;gap:4px;}
    .msg-tick{font-size:11px;color:var(--green);}

    /* TYPING INDICATOR */
    .typing-indicator{display:flex;align-items:center;gap:8px;padding:4px 0;}
    .typing-dots{display:flex;gap:4px;}
    .typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--green);
      animation:typing-bounce 1.4s infinite;}
    .typing-dots span:nth-child(2){animation-delay:0.2s;}
    .typing-dots span:nth-child(3){animation-delay:0.4s;}
    .typing-label{font-size:0.6rem;color:var(--text-dim);letter-spacing:2px;}

    /* INPUT AREA */
    .input-area{padding:14px 18px;border-top:1px solid var(--border);
      display:flex;align-items:flex-end;gap:10px;flex-shrink:0;
      background:rgba(0,4,1,0.98);}
    .attach-btn,.emoji-btn{background:none;border:1px solid rgba(0,255,65,0.15);
      color:var(--text-dim);font-size:16px;width:38px;height:38px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:all 0.2s;border-radius:1px;}
    .attach-btn:hover,.emoji-btn:hover{border-color:var(--green);color:var(--green);}
    .msg-input-wrap{flex:1;position:relative;}
    .msg-input{width:100%;background:rgba(0,255,65,0.04);border:1px solid rgba(0,255,65,0.18);
      padding:11px 16px;color:var(--green);font-family:'Share Tech Mono',monospace;
      font-size:0.82rem;outline:none;resize:none;min-height:40px;max-height:120px;
      overflow-y:auto;letter-spacing:1px;line-height:1.5;border-radius:1px;
      transition:all 0.2s;}
    .msg-input::placeholder{color:rgba(0,255,65,0.2);}
    .msg-input:focus{border-color:var(--green-dim);background:rgba(0,255,65,0.06);}
    .send-btn{width:42px;height:42px;background:var(--green);border:none;
      color:#000;font-size:18px;cursor:pointer;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      transition:all 0.2s;border-radius:1px;}
    .send-btn:hover{background:#00cc35;box-shadow:var(--glow);}
    .send-btn:active{transform:scale(0.95);}

    /* ── RIGHT PANEL (INFO) ── */
    .info-panel{width:260px;min-width:260px;height:100vh;background:rgba(0,4,1,0.97);
      border-left:1px solid var(--border);display:flex;flex-direction:column;
      overflow-y:auto;transition:transform 0.3s ease;}
    .info-panel.hidden{display:none;}
    .info-header{padding:16px;border-bottom:1px solid var(--border);
      font-size:0.65rem;color:var(--green-dim);letter-spacing:3px;}
    .info-avatar{width:70px;height:70px;border-radius:50%;margin:20px auto 10px;
      display:flex;align-items:center;justify-content:center;
      font-family:'Orbitron',monospace;font-size:22px;color:var(--green);
      border:2px solid rgba(0,255,65,0.3);background:rgba(0,255,65,0.07);}
    .info-name{text-align:center;font-family:'Orbitron',monospace;font-size:0.8rem;
      color:var(--green);letter-spacing:2px;margin-bottom:4px;}
    .info-stat{text-align:center;font-size:0.6rem;color:var(--text-dim);letter-spacing:2px;}
    .info-section{padding:14px 16px;border-bottom:1px solid rgba(0,255,65,0.07);}
    .info-section-title{font-size:0.58rem;color:var(--green-dim);letter-spacing:3px;margin-bottom:10px;}
    .info-row{display:flex;justify-content:space-between;margin-bottom:8px;}
    .info-key{font-size:0.6rem;color:var(--text-dim);letter-spacing:1px;}
    .info-val{font-size:0.6rem;color:var(--text);letter-spacing:1px;}
    .info-action-btn{width:100%;padding:10px;margin-bottom:8px;background:transparent;
      border:1px solid rgba(0,255,65,0.15);color:var(--text-dim);
      font-family:'Share Tech Mono',monospace;font-size:0.6rem;letter-spacing:2px;
      cursor:pointer;transition:all 0.2s;text-align:left;}
    .info-action-btn:hover{border-color:var(--green);color:var(--green);background:rgba(0,255,65,0.05);}
    .info-action-btn.danger:hover{border-color:var(--red);color:var(--red);}

    /* ── EMPTY STATE ── */
    .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:16px;opacity:0.4;}
    .empty-state .e-icon{font-size:48px;color:var(--green);}
    .empty-state .e-text{font-size:0.7rem;color:var(--green-dim);letter-spacing:3px;}

    /* ── ANIMATIONS ── */
    @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes typing-bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
    @keyframes scan-top{0%{opacity:0.3}50%{opacity:1}100%{opacity:0.3}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

    .fade-in{animation:fadeIn 0.4s ease;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* ── MODAL (settings / new chat) ── */
    .modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;
      justify-content:center;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);}
    .modal-overlay.show{display:flex;}
    .modal{background:rgba(0,6,1,0.98);border:1px solid var(--green);
      padding:32px 36px;width:90%;max-width:380px;border-radius:2px;
      box-shadow:0 0 40px rgba(0,255,65,0.15);}
    .modal h3{font-family:'Orbitron',monospace;font-size:0.9rem;color:var(--green);
      letter-spacing:3px;margin-bottom:20px;}
    .modal-close{float:right;background:none;border:none;color:var(--text-dim);
      font-size:18px;cursor:pointer;transition:color 0.2s;}
    .modal-close:hover{color:var(--red);}

    /* SETTINGS MENU */
    .settings-item{display:flex;align-items:center;justify-content:space-between;
      padding:12px 0;border-bottom:1px solid rgba(0,255,65,0.07);cursor:pointer;}
    .settings-item:last-child{border-bottom:none;}
    .settings-label{font-size:0.68rem;color:var(--text);letter-spacing:2px;}
    .settings-value{font-size:0.6rem;color:var(--green-dim);letter-spacing:1px;}
    .toggle{width:36px;height:20px;background:rgba(0,255,65,0.15);border-radius:10px;
      position:relative;cursor:pointer;transition:background 0.2s;}
    .toggle.on{background:var(--green);}
    .toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
      border-radius:50%;background:#000;transition:left 0.2s;}
    .toggle.on::after{left:18px;}

    /* TOAST */
    .toast{position:fixed;bottom:24px;right:24px;z-index:200;
      background:rgba(0,6,1,0.97);border:1px solid;border-radius:2px;
      padding:12px 18px;font-size:0.65rem;letter-spacing:2px;
      transform:translateY(80px);transition:transform 0.3s;max-width:280px;}
    .toast.show{transform:translateY(0);}
    .toast.success{border-color:var(--green);color:var(--green);}
    .toast.info{border-color:var(--green-dim);color:var(--green-dim);}

    /* ── RESPONSIVE ── */
    @media(max-width:900px){
      .info-panel{display:none!important;}
    }
    @media(max-width:640px){
      .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);z-index:50;}
      .sidebar.open{transform:translateX(0);}
      .menu-btn{display:flex;}
      .app{flex-direction:column;}
      .chat-area{width:100%;}
    }
  </style>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="app fade-in">
  <!-- ── SIDEBAR ── -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="status-dot"></div>
        <span>ARKANET</span>
      </div>
      <div class="user-profile" onclick="openSettings()">
        <div class="avatar avatar-online" id="user-avatar">?</div>
        <div>
          <div class="user-name" id="user-display-name">CHARGEMENT...</div>
          <div class="user-status">● EN LIGNE</div>
        </div>
        <span style="color:var(--text-dim);font-size:12px;margin-left:auto;">⚙</span>
      </div>
    </div>

    <div class="search-box">
      <input class="search-input" placeholder="[ RECHERCHER UN CONTACT ]" oninput="filterConv(this.value)"/>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" onclick="setTab(this,'all')">TOUS</button>
      <button class="nav-tab" onclick="setTab(this,'unread')">NON LUS</button>
      <button class="nav-tab" onclick="setTab(this,'groups')">GROUPES</button>
    </div>

    <div class="conv-list" id="conv-list">
      <!-- Populated by JS -->
    </div>

    <div class="sidebar-footer">
      <button class="footer-btn" onclick="openNewChat()">+ NOUVEAU</button>
      <button class="footer-btn" onclick="openSettings()">PARAMÈTRES</button>
      <button class="footer-btn danger" onclick="logout()">DÉCO.</button>
    </div>
  </div>

  <!-- ── CHAT AREA ── -->
  <div class="chat-area" id="chat-area">
    <div class="chat-header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="chat-contact-avatar" id="chat-avatar">?</div>
      <div class="chat-contact-info">
        <div class="chat-contact-name" id="chat-contact-name">SÉLECTIONNER UNE CONVERSATION</div>
        <div class="chat-contact-status">
          <div class="status-dot-sm"></div>
          <span id="chat-contact-status">EN LIGNE</span>
        </div>
      </div>
      <div class="chat-actions">
        <button class="action-btn" title="Appel audio" onclick="showToast('APPEL AUDIO — BIENTÔT DISPONIBLE','info')">📞</button>
        <button class="action-btn" title="Appel vidéo" onclick="showToast('APPEL VIDÉO — BIENTÔT DISPONIBLE','info')">📹</button>
        <button class="action-btn" title="Infos contact" onclick="toggleInfoPanel()">ℹ️</button>
        <button class="action-btn" title="Plus" onclick="showContextMenu()">⋮</button>
      </div>
    </div>

    <!-- MESSAGES -->
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="e-icon">🛰</div>
        <div class="e-text">SÉLECTIONNEZ UNE CONVERSATION</div>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <button class="emoji-btn" onclick="insertEmoji()">😊</button>
      <button class="attach-btn" onclick="showToast('PIÈCES JOINTES — BIENTÔT','info')">📎</button>
      <div class="msg-input-wrap">
        <textarea class="msg-input" id="msg-input" rows="1"
          placeholder="[ MESSAGE CHIFFRÉ... ]"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- ── INFO PANEL ── -->
  <div class="info-panel hidden" id="info-panel">
    <div class="info-header">&gt; PROFIL CONTACT</div>
    <div class="info-avatar" id="info-avatar">?</div>
    <div class="info-name" id="info-name">-</div>
    <div class="info-stat" id="info-stat">● EN LIGNE</div>
    <div class="info-section">
      <div class="info-section-title">INFORMATIONS</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ⚠️ REMPLACE PAR TA CONFIG FIREBASE
  const firebaseConfig = {
    apiKey: "VOTRE_API_KEY",
    authDomain: "VOTRE_PROJECT.firebaseapp.com",
    projectId: "VOTRE_PROJECT_ID",
    storageBucket: "VOTRE_PROJECT.appspot.com",
    messagingSenderId: "VOTRE_SENDER_ID",
    appId: "VOTRE_APP_ID"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  window.__auth = auth;
  window.__db = db;
  window.__signOut = signOut;
  window.__addDoc = addDoc;
  window.__collection = collection;
  window.__query = query;
  window.__orderBy = orderBy;
  window.__onSnapshot = onSnapshot;
  window.__serverTimestamp = serverTimestamp;
  window.__doc = doc;
  window.__getDoc = getDoc;

  onAuthStateChanged(auth, async (user) => {
    if(!user){ window.location.href='index.html'; return; }
    window.__currentUser = user;
    // Load user profile
    try {
      const snap = await getDoc(doc(db,'users',user.uid));
      if(snap.exists()){
        const d = snap.data();
        const initials = (d.prenom?.[0]||'') + (d.nom?.[0]||'');
        document.getElementById('user-avatar').textContent = initials.toUpperCase() || '?';
        document.getElementById('user-display-name').textContent = (d.prenom+' '+d.nom).toUpperCase();
        window.__userData = d;
      }
    } catch(e){ console.error(e); }
    window.initChat && window.initChat();
  });
</script>

<script>
/* ── MATRIX ── */
let matrixRunning=true;
(function(){
  const c=document.getElementById('matrix'),ctx=c.getContext('2d');
  const ch='アイウエオカキクケコ0123456789ABCDEF{}[]|\\~';
  let cols,drops;
  function resize(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/20);drops=Array(cols).fill(1);}
  resize();window.addEventListener('resize',resize);
  function draw(){
    if(!matrixRunning){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(0,0,c.width,c.height);return;}
    ctx.fillStyle='rgba(0,0,0,0.06)';ctx.fillRect(0,0,c.width,c.height);
    for(let i=0;i<cols;i++){
      ctx.fillStyle=Math.random()>.95?'#fff':(Math.random()>.7?'#00ff41':'#005a18');
      ctx.font='13px Share Tech Mono,monospace';
      ctx.fillText(ch[Math.floor(Math.random()*ch.length)],i*20,drops[i]*20);
      if(drops[i]*20>c.height&&Math.random()>.975)drops[i]=0;drops[i]++;
    }
  }
  setInterval(draw,50);
})();

function toggleMatrix(btn){
  btn.classList.toggle('on');
  matrixRunning=btn.classList.contains('on');
}

/* ── DEMO CONVERSATIONS ── */
const demoConvs=[
  {id:'c1',name:'ALEX MERCER',initials:'AM',online:true,last:'Salut, tu es là ?',time:'12:03',unread:3,msgs:[]},
  {id:'c2',name:'SARA VOLT',initials:'SV',online:false,last:'On se voit demain ?',time:'Hier',unread:0,msgs:[]},
  {id:'c3',name:'#ARKANET-GÉNÉRAL',initials:'🌐',online:true,last:'Bienvenue sur le réseau !',time:'10:45',unread:7,msgs:[]},
  {id:'c4',name:'MIKE X',initials:'MX',online:true,last:'Code reçu ✓',time:'Hier',unread:0,msgs:[]},
  {id:'c5',name:'NOVA SYSTEM',initials:'NS',online:false,last:'Système de sécurité activé.',time:'Lun',unread:0,msgs:[]},
  {id:'c6',name:'CYPHER 404',initials:'C4',online:true,last:'Mission accomplie.',time:'Dim',unread:0,msgs:[]},
];

// Seed some demo messages
demoConvs[0].msgs=[
  {id:1,text:'Salut ! Tu es connecté au réseau ?',own:false,time:'11:58',sender:'ALEX'},
  {id:2,text:'Oui, je viens de créer mon compte Arkanet.',own:true,time:'12:00',sender:'MOI'},
  {id:3,text:'Excellent ! Le réseau est ultra sécurisé.',own:false,time:'12:01',sender:'ALEX'},
  {id:4,text:'J\'ai vu ça, chiffrement AES-256 🔒',own:true,time:'12:02',sender:'MOI'},
  {id:5,text:'Salut, tu es là ?',own:false,time:'12:03',sender:'ALEX'},
];
demoConvs[2].msgs=[
  {id:1,text:'Bienvenue sur ARKANET — le réseau mondial sécurisé.',own:false,time:'10:40',sender:'SYSTÈME'},
  {id:2,text:'Votre connexion est chiffrée et anonymisée.',own:false,time:'10:41',sender:'SYSTÈME'},
  {id:3,text:'Bienvenue sur le réseau !',own:false,time:'10:45',sender:'NOVA'},
];

let activeConv=null;
let allConvs=[...demoConvs];

function renderConvList(list){
  const el=document.getElementById('conv-list');
  el.innerHTML='';
  list.forEach(conv=>{
    const div=document.createElement('div');
    div.className='conv-item'+(activeConv?.id===conv.id?' active':'');
    div.innerHTML=`
      <div class="conv-avatar${conv.online?' online':''}">${conv.initials}</div>
      <div class="conv-info">
        <div class="conv-name">${conv.name}</div>
        <div class="conv-last">${conv.last}</div>
      </div>
      <div class="conv-meta">
        <span class="conv-time">${conv.time}</span>
        ${conv.unread>0?`<span class="conv-badge">${conv.unread}</span>`:''}
      </div>`;
    div.onclick=()=>openConv(conv);
    el.appendChild(div);
  });
}
renderConvList(allConvs);

function filterConv(q){
  if(!q){ renderConvList(allConvs); return; }
  renderConvList(allConvs.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())));
}
window.filterConv=filterConv;

function setTab(btn,tab){
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='all') renderConvList(allConvs);
  else if(tab==='unread') renderConvList(allConvs.filter(c=>c.unread>0));
  else renderConvList(allConvs.filter(c=>c.name.startsWith('#')));
}
window.setTab=setTab;

function openConv(conv){
  activeConv=conv;
  conv.unread=0;
  renderConvList(allConvs);

  // Update header
  document.getElementById('chat-avatar').textContent=conv.initials;
  document.getElementById('chat-contact-name').textContent=conv.name;
  document.getElementById('chat-contact-status').textContent=conv.online?'EN LIGNE':'HORS LIGNE';
  document.getElementById('info-avatar').textContent=conv.initials;
  document.getElementById('info-name').textContent=conv.name;
  document.getElementById('info-stat').textContent=conv.online?'● EN LIGNE':'○ HORS LIGNE';

  // Render messages
  renderMessages(conv.msgs);

  // Close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
}

function renderMessages(msgs){
  const container=document.getElementById('messages');
  const empty=document.getElementById('empty-state');
  empty.style.display='none';
  container.innerHTML='';

  if(msgs.length>0){
    const sep=document.createElement('div');
    sep.className='date-sep';sep.textContent='AUJOURD\'HUI';
    container.appendChild(sep);
  } else {
    empty.style.display='flex';
  }

  msgs.forEach(m=>container.appendChild(createMsgEl(m)));
  container.scrollTop=container.scrollHeight;
}

function createMsgEl(m){
  const div=document.createElement('div');
  div.className='msg'+(m.own?' own':'');
  div.innerHTML=`
    ${!m.own?`<div class="msg-avatar">${m.sender?.[0]||'?'}</div>`:''}
    <div class="msg-content">
      ${!m.own?`<span class="msg-sender">${m.sender}</span>`:''}
      <div class="msg-bubble">
        <div class="msg-text">${escapeHtml(m.text)}</div>
      </div>
      <div class="msg-time">
        ${m.time}
        ${m.own?'<span class="msg-tick">✓✓</span>':''}
      </div>
    </div>`;
  return div;
}

function escapeHtml(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text||!activeConv) return;

  const now=new Date();
  const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const msg={id:Date.now(),text,own:true,time,sender:'MOI'};
  activeConv.msgs.push(msg);
  activeConv.last=text;
  activeConv.time=time;

  const container=document.getElementById('messages');
  const empty=document.getElementById('empty-state');
  empty.style.display='none';
  container.appendChild(createMsgEl(msg));
  container.scrollTop=container.scrollHeight;

  input.value='';
  input.style.height='auto';
  renderConvList(allConvs);

  // Simulated reply
  if(Math.random()>0.4){
    setTimeout(()=>simulateTyping(),1500);
  }
}
window.sendMessage=sendMessage;

function simulateTyping(){
  const container=document.getElementById('messages');
  const typing=document.createElement('div');
  typing.className='typing-indicator';
  typing.innerHTML=`<div class="typing-dots"><span></span><span></span><span></span></div><span class="typing-label">EN TRAIN D'ÉCRIRE...</span>`;
  container.appendChild(typing);
  container.scrollTop=container.scrollHeight;

  const replies=['Message reçu ✓','Roger that 🔒','Connexion sécurisée.','Bien noté.','D\'accord !','On en reparle bientôt.'];
  setTimeout(()=>{
    container.removeChild(typing);
    const reply={id:Date.now(),text:replies[Math.floor(Math.random()*replies.length)],own:false,
      time:new Date().toTimeString().slice(0,5),sender:activeConv.name.split(' ')[0]};
    activeConv.msgs.push(reply);
    activeConv.last=reply.text;
    container.appendChild(createMsgEl(reply));
    container.scrollTop=container.scrollHeight;
    renderConvList(allConvs);
  },2200);
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); }
}
function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}
window.handleKey=handleKey;
window.autoResize=autoResize;

/* ── EMOJI PICKER (simple) ── */
const emojis=['😊','🔒','✓','🚀','🌐','⚡','💻','🔑','📡','❤️','🔥','👍'];
let emojiOpen=false;
function insertEmoji(){
  if(!emojiOpen){
    const picker=document.createElement('div');
    picker.id='emoji-picker';
    picker.style.cssText='position:fixed;bottom:80px;left:70px;background:rgba(0,8,2,0.98);border:1px solid rgba(0,255,65,0.3);padding:12px;display:flex;flex-wrap:wrap;gap:8px;width:200px;z-index:50;border-radius:2px;';
    emojis.forEach(e=>{
      const btn=document.createElement('button');
      btn.textContent=e;btn.style.cssText='background:none;border:none;font-size:20px;cursor:pointer;';
      btn.onclick=()=>{ document.getElementById('msg-input').value+=e; picker.remove();emojiOpen=false; };
      picker.appendChild(btn);
    });
    document.body.appendChild(picker);
    emojiOpen=true;
    setTimeout(()=>{ document.addEventListener('click',()=>{picker.remove();emojiOpen=false;},{once:true}); },50);
  }
}
window.insertEmoji=insertEmoji;

/* ── LOGOUT ── */
async function logout(){
  closeModal('settings-modal');
  if(window.__signOut && window.__auth){
    await window.__signOut(window.__auth);
  }
  document.querySelector('.app').style.animation='pageOut 0.4s ease forwards';
  setTimeout(()=>window.location.href='index.html',420);
}
window.logout=logout;

/* ── TOAST ── */
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),3500);
}
